name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: [3.13]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            requirements/test.txt

      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Security scan
        run: bandit -r visitor/

      - name: Dependency audit
        run: pip-audit

      - name: Unit tests
        run: |
          pytest tests/unit \
            --cov=visitor \
            --cov-report=term \
            --cov-fail-under=85